name: Build SpaceMax APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract SpaceMax source
        run: unzip -o SpaceMax-v0.2-source.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: SpaceMax
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload SpaceMax APK
        uses: actions/upload-artifact@v4
        with:
          name: SpaceMax-APK
          path: SpaceMax/app/build/outputs/apk/debug/app-debug.apk
